spring:
  application:
    name: carpooling

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carpooling_db}
    username: ${DB_USERNAME:carpooling}
    password: ${DB_PASSWORD:carpooling_dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.flywaydb: INFO
