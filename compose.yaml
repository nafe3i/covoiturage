
services:
  postgres:
    image: postgres:17-alpine
    container_name: carpooling-postgres
    environment:
      POSTGRES_DB: carpooling_db
      POSTGRES_USER: carpooling
      POSTGRES_PASSWORD: carpooling_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpooling -d carpooling_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
